        <div class="ck-content"><p><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Paris, September 2020</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">In June 2020, DOM Security launched the news of releasing a </span></span><a style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(0, 160, 222);font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" href="https://www.dom-security.com/nl/en/newsroom/group-news/anti-microbial-products-news-update#">line-up of anti-microbial products</a><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> for Guard, Pro, and anti-microbial panic bars by Antipanic. In this press release update, read more about the continuation of this ambitious project.</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Overall, the SAP process for the anti-microbial products is finished. The anti-microbial coating by GBneuhaus (trade name: Sanpure) has arrived at DOM Germany in late August. The anti-microbial handles for Guard, as well as the outer knob for Pro, are currently in stock. The test for the inner knob of Pro is currently running and the producer is sure that the inner knobs will be available for delivery by the first weeks of September. More details about the delivery dates for inner knob Pro products will be released as soon as possible, however, interesting clients can start placing their orders now.</span></span></p></div>
