        <div class="ck-content"><p><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Parijs, september 2020</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">In juni 2020 kondigde DOM Security de lancering aan van een </span></span><a style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(0, 160, 222);font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" href="https://www.dom-security.com/nl/en/newsroom/group-news/anti-microbial-products-news-update#">reeks antimicrobiële producten</a><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> voor Guard, Pro en antimicrobiële paniekbalken van Antipanic. Lees in deze update van het persbericht meer over de voortzetting van dit ambitieuze project.</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Over het algemeen is het SAP-proces voor de antimicrobiële producten afgerond. De antimicrobiële coating van GBneuhaus (handelsnaam: Sanpure) is eind augustus aangekomen bij DOM Germany. De antimicrobiële deurkrukken voor Guard, evenals de buitenknop voor Pro, zijn momenteel op voorraad. De test voor de binnenknop van Pro loopt momenteel en de producent is ervan overtuigd dat de binnenknoppen leverbaar zullen zijn in de eerste weken van september. Meer details over de leveringsdata voor Pro-producten met binnenknop worden zo snel mogelijk bekendgemaakt, maar geïnteresseerde klanten kunnen nu al hun bestellingen plaatsen.</span></span></p></div>
