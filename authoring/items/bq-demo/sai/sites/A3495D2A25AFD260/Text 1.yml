        <div class="ck-content"><p><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Paris, septembre 2020</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">En juin 2020, DOM Security a annoncé le lancement d’une </span></span><a style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(0, 160, 222);font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration:none;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" href="https://www.dom-security.com/nl/en/newsroom/group-news/anti-microbial-products-news-update#">gamme de produits antimicrobiens</a><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"> pour Guard, Pro et les barres anti-panique antimicrobiennes d’Antipanic. Dans cette mise à jour du communiqué de presse, découvrez-en plus sur la poursuite de ce projet ambitieux.</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Dans l’ensemble, le processus SAP pour les produits antimicrobiens est terminé. Le revêtement antimicrobien de GBneuhaus (nom commercial : Sanpure) est arrivé chez DOM Allemagne fin août. Les poignées antimicrobiennes pour Guard, ainsi que le bouton extérieur pour Pro, sont actuellement en stock. Le test du bouton intérieur de Pro est actuellement en cours et le producteur est convaincu que les boutons intérieurs seront disponibles à la livraison dès les premières semaines de septembre. Plus de détails concernant les dates de livraison des produits Pro avec bouton intérieur seront communiqués dès que possible. Les clients intéressés peuvent toutefois déjà passer leurs commandes.</span></span></p></div>
