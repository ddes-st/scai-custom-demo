        <div class="ck-content"><p><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Meanwhile, Antipanic as the main producer of panic bars is still in talks with Inver as the primary supplier for silver ion paint for panic bars. Currently, the plan is to start production sometime in November this year.</span></span><br /><br /><span style="background-color:rgb(255,255,255);color:rgb(51,51,51);"><span style="-webkit-text-stroke-width:0px;display:inline !important;float:none;font-family:&quot;Source Sans Pro&quot;, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:300;letter-spacing:normal;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">To receive more news around the development of anti-microbial products by DOM Security, follow our social media channels and subscribe to our newsletter.</span></span></p></div>
