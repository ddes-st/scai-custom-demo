      Hint: Title
      Value: Nous faisons plus de cookies
    - ID: "7ea22f95-9d73-5446-8f56-383124266246"
      Hint: Intro
      Value: "Notre site utilise des cookies. En continuant à utiliser notre site, vous acceptez notre <a href=\"https://www.dom-security.com/be/en/legal/data-protection\">Politique de protection des données</a>."
    - ID: "a9252e58-ace3-55dd-96b2-a1df1c7dddab"
      Hint: Body
      Value: "Nous utilisons des cookies sur notre site web. Outre les cookies obligatoires nécessaires aux fonctions techniques de base du site web, cela comprend également des cookies supplémentaires facultatifs de nos partenaires (Google Analytics, Facebook Connect, LinkedIn Analytics, LeadForensics), qui nous aident à exploiter notre site web de manière rentable, à l’améliorer et à analyser les accès à notre site web. Vous trouverez de plus amples informations (y compris la possibilité de retirer votre consentement à tout moment) sous Protection des données."
    - ID: "1e84fb03-7112-5f48-aefe-2989c64c7612"
      Hint: Manage Cookies
      Value: "<link text=\"Gérer les cookies\" linktype=\"internal\" url=\"/legal/cookies\" anchor=\"\" target=\"\" id=\"{4961AE7B-2BA7-52BE-87C4-42A63BABF5DA}\" />"
