    - ID: "7baa9339-90b2-5736-ba26-24d48b833541"
      Hint: About
      Value: "<p>With the highest security certifications, such as VDS, SKG, IP, T90 the ELS Pro cylinder conforms to all European EN norms. The Plug &amp; Play system offers you flexibility, and with a few parts you always get the right fit directly. With 10 different types we have a solution for almost every door setup. It offers a tremendous level of reliability, which guarantees the ELS Pro cylinder's long-term durability. It is available in four tints - stainless steel, black, white and polished brass - thereby responding to the trends and needs of modern architecture.</p>"
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
