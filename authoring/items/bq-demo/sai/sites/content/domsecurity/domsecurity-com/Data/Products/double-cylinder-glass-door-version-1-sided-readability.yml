    - ID: "7baa9339-90b2-5736-ba26-24d48b833541"
      Hint: About
      Value: "<p>Met de hoogste veiligheidscertificaten, zoals VDS, SKG, IP en T90, voldoet de ELS Pro-cilinder aan alle Europese EN-normen. Het Plug &amp; Play-systeem biedt u flexibiliteit, en met enkele onderdelen krijgt u altijd meteen de juiste pasvorm. Met 10 verschillende types hebben we een oplossing voor bijna elke deurconfiguratie. Het biedt een uitzonderlijk hoog betrouwbaarheidsniveau, wat de langdurige duurzaamheid van de ELS Pro-cilinder garandeert. Hij is verkrijgbaar in vier tinten: roestvrij staal, zwart, wit en gepolijst messing, en speelt daarmee in op de trends en behoeften van de moderne architectuur.</p>"
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
      Hint: __Revision
      Value: "944c9722-5b35-4d99-bf80-f2156bebb9d5"
    - ID: "b837b1d3-e05b-5a90-8364-55d29c27496d"
      Hint: Benefits
      Value: |
        <ul>
        <li>Welke beveiligingsbehoeften uw gebouw ook heeft, ELS Pro dekt ze allemaal.</li>
        <li>Standaardtoepassing op inbraakwerende (SKG3), brandwerende (T90) en buitendeuren (IP65).</li>
        <li>Beschikbaar in verschillende uitvoeringen, zoals halve, volledige en dubbelzijdige cilinders, voor vluchtdeuren (EN179) of glazen deuren.</li>
        <li>Dankzij het Plug &amp; Play-systeem kunt u de cilinder eenvoudig aanpassen aan de juiste lengte wanneer u verhuist of deurdikte verandert.</li>
        <li>Eenvoudige batterijvervanging, zodat u nooit buitengesloten raakt.</li>
        <li>Verschillende kleurafwerkingen bieden een oplossing voor elke smaak.</li>
        <li>Een uitzonderlijk hoge betrouwbaarheid voor een lange levensduur.</li>
        <li>U hoeft de sloten niet te vervangen als u kiest voor een upgrade naar onlinefuncties – die standaard al zijn voorzien.</li>
        </ul>
        <p><strong>Aanbevolen toepassingen:</strong> luchthavens, onderwijsinstellingen, financiële instellingen, woningen, ziekenhuizen, hotels, industriële omgevingen, middelgrote tot grote bedrijven, kantoren, productievestigingen, openbare gebouwen, kleine tot middelgrote bedrijven</p>
