    - ID: "b837b1d3-e05b-5a90-8364-55d29c27496d"
      Hint: Benefits
      Value: |
        <ul>
        <li>Quels que soient vos besoins en matière de sécurité pour votre établissement, ELS Pro y répond.</li>
        <li>Application standard sur les portes anti-effraction (SKG3), coupe-feu (T90) et extérieures (IP65).</li>
        <li>Disponible en différentes versions, notamment demi-cylindre, cylindre double, double entrée, pour portes d’évacuation (EN179) ou portes vitrées.</li>
        <li>Le système Plug &amp; Play vous permet d’adapter facilement le cylindre à la longueur correcte lors d’un déménagement ou d’un changement d’épaisseur de porte.</li>
        <li>Remplacement facile de la pile pour ne jamais rester enfermé à l’extérieur.</li>
        <li>Différentes finitions colorées permettent de créer une solution pour tous les goûts.</li>
        <li>Un niveau de fiabilité exceptionnel pour une durabilité à long terme.</li>
        <li>Il n’est pas nécessaire de remplacer les serrures si vous optez pour une mise à niveau vers des fonctionnalités en ligne : celles-ci sont déjà prévues de série.</li>
        </ul>
        <p><strong>Applications recommandées :</strong> Aéroports, établissements d’enseignement, secteur financier, habitations, hôpitaux, hôtels, sites industriels, entreprises de taille moyenne à grande, bureaux, usines, bâtiments publics, petites et moyennes entreprises</p>
