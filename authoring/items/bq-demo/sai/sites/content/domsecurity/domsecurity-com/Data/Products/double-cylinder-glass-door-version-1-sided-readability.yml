    - ID: "7baa9339-90b2-5736-ba26-24d48b833541"
      Hint: About
      Value: <p>Avec ses certifications de sécurité les plus élevées, telles que VDS, SKG, IP et T90, le cylindre ELS Pro est conforme à toutes les normes européennes EN. Le système Plug &amp; Play vous offre une grande flexibilité et, grâce à quelques pièces seulement, vous obtenez toujours directement la configuration adaptée. Avec 10 types différents, nous proposons une solution pour presque toutes les configurations de portes. Il offre un niveau de fiabilité exceptionnel, garantissant la durabilité du cylindre ELS Pro à long terme. Il est disponible en quatre finitions — acier inoxydable, noir, blanc et laiton poli — répondant ainsi aux tendances et aux besoins de l’architecture moderne.</p>
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
