    - ID: "9481999d-7c67-4534-a795-dbbe93bbb295"
      Hint: Description
      Value: "<p>« Sodexo a renforcé sa compétitivité et a réalisé des progrès significatifs par rapport aux priorités que j'avais fixées en prenant les fonctions de Directrice Générale. Aujourd'hui, avec notre stratégie de recentrage et d'accélération, et grâce à une attention de chaque instant portée à l'exécution opérationnelle, nous prévoyons la poursuite de l'amélioration de notre performance dans les années à venir. Je suis convaincue de la capacité de Sodexo à réaliser une croissance interne solide et une marge d'exploitation supérieure à 6%. Nos collaborateurs sont essentiels à la réussite de ce plan, et je tiens à les remercier pour l'excellent travail qu'ils accomplissent au quotidien pour offrir des services de qualité à nos clients et consommateurs. Ils contribuent ainsi à notre impact positif sur la société et dans les territoires où nous opérons. Je suis convaincue que nous sommes sur la bonne voie pour réaliser une croissance rentable sur le long terme et être le leader mondial en matière d'alimentation durable et d'expériences à haute valeur ajoutée à tous les moments de la vie : éducation, travail, soin et divertissement. »</p>"
