    - ID: "7e9b9af6-c553-4818-8ab8-4f8301531537"
      Hint: brandFaq2Answer
      Value: "<p>Our menu philosophy is built around three pillars that matter to today’s workforce: health, flavor, and sustainability. We follow a plant-forward, seasonal approach rooted in the EAT-Lancet recommendations. Local chef ambassadors bring global inspiration and regional relevance, creating menus that feel fresh, modern, and aligned with your employees’ expectations.</p>"
    - ID: "81a68f76-c9d4-4d2c-a040-61a3c740f0f0"
      Hint: brandPillar1Description
      Value: "<p>Healthy workplace eating shouldn't mean compromising on flavor. Our chef-crafted menus balance nutrition with the craveable tastes your teams actually want, supporting employee well-being through food they genuinely look forward to.</p>"
    - ID: "8a4d6cca-c8ab-45b3-9fde-6b87ce56346f"
      Hint: brandHighlight1Title
      Value: "Delicious, wholesome food that contributes to employee well-being"
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
      Hint: __Revision
      Value: "b13b7f82-ae96-4217-97aa-660c2f3cb573"
    - ID: "9559c310-8bb7-4b71-a3f8-3ac6b724a8ed"
      Hint: brandFaqTitle
      Value: Frequently asked questions about Modern Recipe
    - ID: "ad8167b5-33a2-4776-83e6-aa86e55e8779"
      Hint: brandHighlight3Body
      Value: "<p>Sustainability isn't an add-on, it's how we cook. Plant-forward menus, seasonal recipes, local sourcing, and low-waste kitchens reduce environmental impact.</p><ul><li>Plant-forward menus</li><li>Locally-sourced &amp; diverse products</li><li>Fair-trade coffees and teas</li><li>Recyclable packaging</li></ul>"
    - ID: "add025f9-e769-4952-b0e4-b69b0d22c368"
      Hint: brandPillar4Description
      Value: "<p>A full-service dining destination designed for how your teams actually work, inspired by the vibrant food court experience. From grab-and-go breakfast to sit-down lunch meetings, our restaurant hub adapts to every schedule. Seamless digital ordering, chef-crafted menus, and flexible seating create a corporate dining experience that keeps people coming back to the office.</p>"
    - ID: "b7b0c748-0cf6-4060-b0ea-aa27f59563a3"
      Hint: brandHighlight1Body
      Value: "<p>Your employees feel their best when they don't have to choose between healthy and delicious. Modern Recipe brings joy to the table while supporting your teams' well-being.</p><ul><li>Fresh, seasonal and high-quality ingredients</li><li>Balanced and nutrient-dense meals available all day long</li><li>Global &amp; tailor-made menus that celebrate regional flavors</li><li>Local chef ambassadors bringing signature style to every dish</li></ul>"
    - ID: "b8eca4e8-8b72-4abd-9fc2-e5a2665cd202"
      Hint: brandHighlight2Body
      Value: "<p>Modern Recipe designs workplace dining spaces around your unique needs, from morning coffee to after-work drinks, always with a warm welcome.</p><ul><li>Eating spaces thoughtfully designed to spark workplace connection</li><li>Flexible layouts to adapt the space to your people</li><li>Expert-led hospitality training that elevates every employee’s experience</li></ul>"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\damien.despas@sitecore.com
    - ID: "c481585f-e0b7-41c4-8f43-a0da2b98ca57"
      Hint: brandFaq4Answer
      Value: "<p>Sustainability is embedded in every part of our model, not added on. We prioritize seasonal, local sourcing, reduce food miles, and partner with diverse suppliers and small producers. Our kitchens follow low-waste practices, and we use recyclable or reusable packaging as a priority.</p>"
