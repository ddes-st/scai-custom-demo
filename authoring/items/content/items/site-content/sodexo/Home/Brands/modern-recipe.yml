    - ID: "ce43ad20-32f6-4ac1-9e3d-0e9bf990ab63"
      Hint: brandHighlight3Title
      Value: Responsibly sourced food. Good for people, good for the planet.
    - ID: "cf55747b-f906-4c19-9321-c4260b2ba4b3"
      Hint: brandFaq1Answer
      Value: "<p>Modern Recipe goes far beyond food service. We help organizations strengthen workplace culture, boost employee well-being and performance, and create spaces where people genuinely want to be. Our offer combines chef-crafted, made-from-scratch meals with hospitality designed to make employees feel taken care of, whether they’re grabbing a quick breakfast or hosting a team lunch.</p>"
    - ID: "d47a9059-8500-479e-8990-9797ed0c3ad7"
      Hint: brandPillar1Title
      Value: Everyday healthy & delicious food
    - ID: "d4f989b6-e6f8-441f-8c44-cfde19d897d5"
      Hint: brandStoryBody
      Value: "<p><strong>Shell x Modern Recipe</strong></p><p>See how Modern Recipe transformed office dining at Shell’s headquarters in London, increasing restaurant visits while strengthening workplace culture and employee satisfaction.</p><p>Ready to transform your workplace dining experience? Contact us.</p>"
