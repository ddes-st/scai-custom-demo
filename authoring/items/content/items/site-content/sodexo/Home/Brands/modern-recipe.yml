    - ID: "fac8bd4b-e59e-41a7-8180-c5db3af239fc"
      Hint: brandFaq3Answer
      Value: "<p>Our food offer includes nutrient-dense meals, global flavors, and a wide variety of plant-forward dishes, alongside options that are low salt, low sugar, or tailored to specific dietary needs. With balanced meals available all day across restaurants, markets, cafés, and smart fridges, employees always find something that fits their lifestyle.</p>"
