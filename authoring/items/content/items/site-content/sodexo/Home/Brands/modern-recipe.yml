    - ID: "ed142c53-d0d7-4f75-8dfd-9c7fb39dc099"
      Hint: brandHeroSubtitle
      Value: <p>Modern Recipe delivers healthy, made from scratch meals with sustainably sourced ingredients, from morning coffee to late afternoon energy. We design workplace dining experiences that help teams gather, recharge, and perform at their best. Because the best ideas happen when your people feel truly taken care of.</p>
    - ID: "ef595ce1-8702-44a9-8688-8fb152d43dd3"
      Hint: brandCtaSubhead
      Value: <p>A growing number of companies are choosing Modern Recipe to strengthen workplace culture. Turn everyday office dining into a meaningful experience that supports retention, connection, and the way your teams work together.</p>
