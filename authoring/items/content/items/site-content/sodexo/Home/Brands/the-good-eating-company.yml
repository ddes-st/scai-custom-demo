    - ID: "ad8167b5-33a2-4776-83e6-aa86e55e8779"
      Hint: brandHighlight3Body
      Value: <p>For people and planet. Sustainably sourced ingredients, local partnerships, and a commitment to reducing waste, because great food should do good too.</p>
    - ID: "add025f9-e769-4952-b0e4-b69b0d22c368"
      Hint: brandPillar4Description
      Value: <p>Bringing restaurant quality dining into your workplace. We invite your employees to pause from the workday and delight in the culinary adventure we take them on, discovering new flavors and curated food experiences. Our dining spaces are thoughtfully designed so people can collaborate, socialize, work, and relax in an environment they feel proud to share with clients and colleagues.</p>
    - ID: "b7b0c748-0cf6-4060-b0ea-aa27f59563a3"
      Hint: brandHighlight1Body
      Value: "<p>A new destination, every day. Diverse, culturally-rich recipes that transport guests around the world and transform lunch into a culinary journey.</p>"
    - ID: "b8eca4e8-8b72-4abd-9fc2-e5a2665cd202"
      Hint: brandHighlight2Body
      Value: <p>Twists on the ordinary. Our chefs reimagine classic dishes with creativity and craft using the finest and freshest seasonal ingredients to create signature dishes that surprise and delight.</p>
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
