    - ID: "c481585f-e0b7-41c4-8f43-a0da2b98ca57"
      Hint: brandFaq4Answer
      Value: "<p>Sustainability is built into how we cook and serve. We prioritize seasonal and responsible sourcing with local producers, reduce food waste in our kitchens, and design menus that lower the carbon impact of dining without compromising flavor. The same care runs through hospitality: recyclable packaging where needed, and partnerships that support people and planet.</p>"
