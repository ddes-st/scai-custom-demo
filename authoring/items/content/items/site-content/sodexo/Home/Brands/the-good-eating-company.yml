    - ID: "ed142c53-d0d7-4f75-8dfd-9c7fb39dc099"
      Hint: brandHeroSubtitle
      Value: "<p>Restaurant-quality food. Inviting spaces. Warm, attentive service. The Good Eating Company creates premium corporate fine dining and catering experiences that turn your office into the place to be, helping you attract and retain the talent that drives your business.</p>"
    - ID: "ef595ce1-8702-44a9-8688-8fb152d43dd3"
      Hint: brandCtaSubhead
      Value: <p>For 25 years, The Good Eating Co has delivered distinctive, memorable food experiences for organizations that understand the value of investing in their people. We’re proud to partner with clients who share our belief that exceptional workplace dining strengthens culture and inspires performance.</p>
