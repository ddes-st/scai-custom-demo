    - ID: "cf55747b-f906-4c19-9321-c4260b2ba4b3"
      Hint: brandFaq1Answer
      Value: <p>We focus on creating food moments that genuinely elevate the workday. Our chefs craft menus that celebrate flavor, seasonality, and wellbeing, while our service approach brings warmth and hospitality to every interaction. Whether it’s daily meals, meeting refreshments, or bespoke experiences, we design food that supports connection, energy, and a positive workplace culture.</p>
    - ID: "d47a9059-8500-479e-8990-9797ed0c3ad7"
      Hint: brandPillar1Title
      Value: Chef crafted menus, always with care.
    - ID: "d4f989b6-e6f8-441f-8c44-cfde19d897d5"
      Hint: brandStoryBody
      Value: <p>We create workplace dining experiences that give your people a reason to come together. Exceptional food, welcoming service, and spaces designed for connection. Our chefs bring diverse backgrounds and fresh ideas to every plate, with signature recipes and themed events that spark discovery and delight.</p>
