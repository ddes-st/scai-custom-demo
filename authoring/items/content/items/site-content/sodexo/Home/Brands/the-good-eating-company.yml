    - ID: "7e9b9af6-c553-4818-8ab8-4f8301531537"
      Hint: brandFaq2Answer
      Value: <p>Our expert chefs build menus around what each season naturally offers, allowing ingredients at their peak to guide the experience. We prioritize fresh, responsible ingredients sourced with local producers and adapt the offer throughout the year. We celebrate culinary diversity with cultural respect and a true integrity of flavor.</p>
    - ID: "81a68f76-c9d4-4d2c-a040-61a3c740f0f0"
      Hint: brandPillar1Description
      Value: <p>We elevate simple cuisine with refined technique and meticulous craft, using the freshest ingredients to add creative twists to classic dishes.</p>
