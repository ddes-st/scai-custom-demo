      Hint: brandFaqTitle
      Value: "Frequently asked questions about on-site food services"
    - ID: "ad8167b5-33a2-4776-83e6-aa86e55e8779"
      Hint: brandHighlight3Body
      Value: "<p>Kitchen Works uses digital solutions, from mobile ordering to self-checkout and scan &amp; go, that deliver fast, frictionless on-site dining across all shifts. These formats ensure 24/7 access to fresh food, reduce queues, and keep break times efficient.</p>"
    - ID: "add025f9-e769-4952-b0e4-b69b0d22c368"
      Hint: brandPillar4Description
      Value: "<p>The Kitchen Works Eatery is your core on-site dining solution. Designed around the rhythm of shift-based work, teams get fresh, satisfying meals from breakfast through dinner — chef-driven menus, a space built to recharge, and a dining experience that keeps energy levels up across the day.</p>"
    - ID: "b7b0c748-0cf6-4060-b0ea-aa27f59563a3"
      Hint: brandHighlight1Body
      Value: "<p>Supporting busy teams starts with fresh, satisfying meals that fit tight schedules.</p><ul><li>Protein-packed choices, full of flavor</li><li>Regional favorites and global cuisine</li><li>Seasonal offers and theme days</li><li>Culinary collaborations that spark new menus</li></ul>"
    - ID: "b8eca4e8-8b72-4abd-9fc2-e5a2665cd202"
      Hint: brandHighlight2Body
      Value: "<p>From familiar favorites to new flavors, our on-site dining solutions are designed to feel welcoming, inclusive and practical.</p><ul><li>Quick ordering — mobile and pre-order pickup</li><li>24/7 access — micro markets and smart vending</li><li>Smart menus that reduce decision fatigue</li><li>Sustainable sourcing and fair-trade options</li></ul>"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\damien.despas@sitecore.com
    - ID: "c481585f-e0b7-41c4-8f43-a0da2b98ca57"
      Hint: brandFaq4Answer
      Value: <p>Night shift workers face disrupted metabolism, limited food access, and energy crashes. Kitchen Works addresses this with balanced overnight menus, 24/7 micro market and vending access, and smart meal timing before and after peak exertion periods.</p>
