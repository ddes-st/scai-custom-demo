    - ID: "cf55747b-f906-4c19-9321-c4260b2ba4b3"
      Hint: brandFaq1Answer
      Value: "<p>Traditional canteens typically offer a limited, fixed menu during standard lunch hours. Kitchen Works reimagines on-site food services by providing chef-prepared meals across multiple formats, from full-service restaurants to grab-and-go micro markets, available throughout the day and across every shift.</p>"
