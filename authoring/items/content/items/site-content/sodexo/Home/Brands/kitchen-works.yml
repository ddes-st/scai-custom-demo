    - ID: "7e9b9af6-c553-4818-8ab8-4f8301531537"
      Hint: brandFaq2Answer
      Value: <p>Kitchen Works is modular by design. A site can combine The Eatery, Micro Kitchen, Market, Break Room, and Food Carts to match workforce size, shift patterns, and available space.</p>
    - ID: "81a68f76-c9d4-4d2c-a040-61a3c740f0f0"
      Hint: brandPillar1Description
      Value: "<p>Energizing, feel-good nutrition is essential for a productive workforce. Our balanced, freshly prepared meals keep teams fueled and focused across every shift.</p>"
    - ID: "8a4d6cca-c8ab-45b3-9fde-6b87ce56346f"
      Hint: brandHighlight1Title
      Value: Food that boosts performance.
