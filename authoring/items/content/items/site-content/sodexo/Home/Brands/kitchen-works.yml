      Hint: brandHeroSubtitle
      Value: "<p>Kitchen Works delivers on-site food services built for shift-based teams. Our chef-prepared meals support well-being, sustained energy, and operational continuity, helping teams reset, refuel, and reconnect, all while making eating well easy.</p>"
    - ID: "ef595ce1-8702-44a9-8688-8fb152d43dd3"
      Hint: brandCtaSubhead
      Value: "<p>Join a growing number of organizations worldwide choosing Kitchen Works to elevate the everyday on-site dining experience for your teams. Consistent, scalable, and built around the way you operate.</p><p>Ready to fuel well-being and productivity with nutritious meals?</p>"
